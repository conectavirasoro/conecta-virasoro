<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b46">
<title>Administración | Conecta Virasoro</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#17243a}
header{background:#102b46;color:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:bold}.logo span{color:#36d6a0}header a{color:#fff;text-decoration:none}
main{max-width:1100px;margin:35px auto;padding:0 18px}.panel{background:#fff;padding:26px;border-radius:14px;box-shadow:0 3px 18px #0000000d}
h1{margin-top:0}.muted{color:#667085;line-height:1.5}.login{max-width:440px;margin:55px auto}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label{font-weight:bold;font-size:14px}.field input{padding:13px;border:1px solid #d5dce5;border-radius:8px;font-size:16px}
button{border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary{background:#20b98b;color:#fff}.secondary{background:#eaf0f6;color:#17324c}.danger{background:#fff0f0;color:#b42318}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.toolbar button.active{background:#102b46;color:#fff}
.status{padding:12px;border-radius:8px;margin:14px 0;background:#eaf8f3;color:#176b55}.status.error{background:#fff0f0;color:#b42318}
.cards{display:grid;gap:14px}.publication{border:1px solid #e4e9ef;border-radius:12px;padding:18px}.publication h3{margin:8px 0}.meta{font-size:13px;color:#667085;line-height:1.6}.tag{display:inline-block;background:#fff4d6;color:#805b00;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions a{color:#176b79}.empty{text-align:center;padding:30px;color:#667085}
[hidden]{display:none!important}@media(max-width:600px){header{justify-content:center;text-align:center}.panel{padding:19px}}
</style>
</head>
<body>
<header><div class="logo">Conecta <span>Virasoro</span> · Administración</div><a href="index.html">← Ver sitio</a></header>
<main>
<section id="loginPanel" class="panel login">
<h1>🔐 Acceso administrativo</h1>
<p class="muted">Ingresá con la cuenta autorizada del equipo de Conecta Virasoro.</p>
<form id="loginForm">
<div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="primary" id="loginButton" type="submit">Ingresar</button>
</form>
<div id="loginMessage" role="status" aria-live="polite"></div>
</section>
<section id="dashboard" class="panel" hidden>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<div><h1>📋 Publicaciones recibidas</h1><p class="muted">Revisá cada solicitud antes de mostrarla en el sitio.</p></div>
<button class="secondary" id="logoutButton">Cerrar sesión</button>
</div>
<div id="dashboardMessage" role="status" aria-live="polite"></div>
<div class="toolbar">
<button class="secondary active" data-filter="pendiente">Pendientes</button>
<button class="secondary" data-filter="aprobada">Aprobadas</button>
<button class="secondary" data-filter="rechazada">Rechazadas</button>
<button class="secondary" data-filter="todas">Todas</button>
<button class="primary" id="refreshButton">↻ Actualizar</button>
</div>
<div id="publicationList" class="cards"><div class="empty">Cargando...</div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
